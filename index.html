<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sib's Trading – Orders & Inventory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --pine:#14342B;--paper:#F2F4EE;--surface:#FFFFFF;--ink:#17231E;--muted:#5A6862;--line:#D9DED6;
  --saffron:#E9A21B;--on-saffron:#2A1B00;
  --bad:#B3321F;--bad-bg:#FBE6E1;--ok:#1E6A44;--ok-bg:#E0F1E7;--warn:#80530A;--warn-bg:#FBEECB;
  --info:#1D5FB8;--info-bg:#E1ECFA;--focus:#1D6FD8;--shadow:0 1px 2px rgba(20,52,43,.08),0 10px 30px rgba(20,52,43,.08);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'DM Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --pine:#0C211B;--paper:#0E1612;--surface:#16211C;--ink:#E6EDE8;--muted:#9BAAA2;--line:#2B3B34;
    --bad:#F28B78;--bad-bg:#3B1D18;--ok:#6CCB9A;--ok-bg:#16352A;--warn:#F0B94A;--warn-bg:#3A2D0E;
    --info:#7FB0F5;--info-bg:#1A2E4A;--focus:#6FA8F5;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --pine:#0C211B;--paper:#0E1612;--surface:#16211C;--ink:#E6EDE8;--muted:#9BAAA2;--line:#2B3B34;
  --bad:#F28B78;--bad-bg:#3B1D18;--ok:#6CCB9A;--ok-bg:#16352A;--warn:#F0B94A;--warn-bg:#3A2D0E;
  --info:#7FB0F5;--info-bg:#1A2E4A;--focus:#6FA8F5;--shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;letter-spacing:-.01em}
h1{font-size:clamp(26px,4vw,36px);font-weight:800}
h2{font-size:22px;font-weight:700}
h3{font-size:18px;font-weight:700}
p{margin:0 0 .6em}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

/* buttons & fields */
.btn{font:inherit;font-weight:700;border-radius:10px;padding:10px 16px;min-height:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--saffron);border-color:var(--saffron);color:var(--on-saffron)}
.btn.primary:hover{filter:brightness(1.05)}
.btn.danger{color:var(--bad)}
.btn.danger.solid{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:14px}
.btn.block{width:100%}
.btn:disabled{opacity:.5;cursor:not-allowed}
.field{margin-bottom:14px}
.field label,.lbl{display:block;font-weight:700;font-size:14px;margin-bottom:6px}
input,select,textarea{width:100%;font:inherit;padding:10px 12px;min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
fieldset{border:0;padding:0;margin:0;min-width:0}
fieldset:disabled{opacity:.55}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:480px){.row2{grid-template-columns:1fr}}
.msg{padding:10px 12px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-weight:600;margin:0 0 14px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:var(--paper);border:1px solid var(--line);border-radius:12px;margin-bottom:18px}
.seg.three{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:none;font:inherit;font-weight:700;padding:10px 6px;border-radius:9px;color:var(--muted);cursor:pointer;min-height:42px}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;font-size:14px;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;min-height:38px}
.chip.on{background:var(--pine);border-color:var(--pine);color:#fff}
.badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:13px;font-weight:700;white-space:nowrap}
.badge.bad{background:var(--bad-bg);color:var(--bad)}
.badge.ok{background:var(--ok-bg);color:var(--ok)}
.badge.warn{background:var(--warn-bg);color:var(--warn)}
.badge.muted{background:var(--paper);color:var(--muted);border:1px solid var(--line)}

/* login */
.login{min-height:100dvh;display:grid;grid-template-columns:1.1fr 1fr}
@media(max-width:860px){.login{grid-template-columns:1fr}}
.board{background:var(--pine);color:#F2F4EE;padding:clamp(24px,5vw,56px);display:flex;flex-direction:column;justify-content:space-between;gap:36px}
.wordmark{font-family:var(--f-display);font-weight:800;font-size:clamp(52px,9vw,104px);line-height:.92;letter-spacing:-.03em;margin:0}
.wordmark-sub{margin:16px 0 0;font-size:18px;color:#C9D6CF;border-top:4px solid var(--saffron);padding-top:14px;max-width:26ch}
.pb h2{font-size:18px;font-weight:600;color:#C9D6CF;margin-bottom:10px}
.pb ul{list-style:none;margin:0;padding:0;max-width:440px}
.pb li{display:flex;align-items:baseline;gap:8px;padding:5px 0;font-size:17px}
.pb .lead{flex:1;border-bottom:2px dotted rgba(255,255,255,.35);transform:translateY(-4px)}
.pb .price{font-weight:700;white-space:nowrap}
.gate{padding:clamp(20px,5vw,48px);display:grid;place-items:center}
.gate-card{width:min(420px,100%)}
.gate-card h2{font-size:28px;margin-bottom:4px}
.gate-card .sub{color:var(--muted);margin-bottom:18px}
.lockbox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:14px 16px;margin-bottom:16px}
.lockbox strong{display:block;font-size:17px;margin-bottom:2px}
.lockbox b{font-variant-numeric:tabular-nums;font-size:18px}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--ink);text-decoration:underline;cursor:pointer}
.switch{margin-top:16px;text-align:center;color:var(--muted)}

/* shell */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--pine);color:#fff;display:flex;flex-wrap:wrap;align-items:center;gap:6px 20px;padding:10px 20px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:21px;letter-spacing:-.01em}
.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--saffron);color:var(--on-saffron);font-size:20px}
.pill{font-family:var(--f-body);font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:rgba(255,255,255,.14)}
.top nav{display:flex;gap:4px;overflow-x:auto;order:3;width:100%}
@media(min-width:900px){.top nav{order:0;width:auto;flex:1}}
.tab{background:none;border:0;color:#D5DED8;font:inherit;font-weight:700;padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;min-height:40px}
.tab:hover{color:#fff}
.tab[aria-current="page"]{background:rgba(255,255,255,.12);color:#fff;box-shadow:inset 0 -3px 0 var(--saffron)}
.who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:15px}
.who .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4)}
.wrap{max-width:1180px;margin:0 auto;padding:22px 20px 40px}
.banner{background:var(--warn-bg);color:var(--warn);padding:10px 20px;font-weight:600;text-align:center}
.page-head{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.card+.card{margin-top:16px}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty.sm{padding:14px 4px}

/* tables */
.table-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:13px;font-weight:600;color:var(--muted);padding:11px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
.acts{display:flex;gap:6px;flex-wrap:wrap}
td.r,th.r{text-align:right}
.pos{color:var(--ok);font-weight:700}
.neg{color:var(--bad);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.tile span{display:block;color:var(--muted);font-size:14px}
.tile b{font-family:var(--f-display);font-size:30px;line-height:1.2}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:860px){.two{grid-template-columns:1fr}}
.two .card+.card{margin-top:0}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.callout{background:var(--warn-bg);color:var(--warn);border-radius:14px;padding:16px 18px;margin-bottom:16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.callout p{margin:0;font-weight:600}
.callout .btn{background:var(--surface);color:var(--ink)}

/* shop */
.has-fab{display:block}
.shop{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
@media(max-width:960px){.shop{grid-template-columns:1fr}.has-fab{padding-bottom:84px}}
.shop-head{display:flex;flex-direction:column;gap:12px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.grid .notice{grid-column:1/-1}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:6px}
.pcard.out{opacity:.7}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.tag{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;white-space:nowrap}
.price{font-family:var(--f-display);font-weight:800;font-size:26px}
.price small{font-family:var(--f-body);font-weight:500;font-size:14px;color:var(--muted)}
.avail{font-size:14px;font-weight:600}
.avail.ok{color:var(--ok)}.avail.warn{color:var(--warn)}.avail.bad{color:var(--bad)}
.buy{display:flex;align-items:center;gap:8px;margin-top:6px}
.buy input{width:84px;min-width:0}
.buy .unit{color:var(--muted);font-size:14px}
.buy .btn{margin-left:auto}
.cart{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.cart h2{margin-bottom:10px}
.cline{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cline .nm{font-weight:700}
.cline .sub{color:var(--muted);font-size:13px}
.cline .qty{display:flex;align-items:center;gap:6px}
.cline .qty input{width:78px;min-height:36px;padding:6px 8px}
.cline .amt{font-weight:700;text-align:right;align-self:center}
.icon{background:none;border:0;color:var(--muted);cursor:pointer;font-size:18px;padding:6px;border-radius:8px;min-width:36px;min-height:36px}
.icon:hover{color:var(--bad)}
.totalrow{display:flex;justify-content:space-between;align-items:baseline;font-size:20px;font-weight:800;font-family:var(--f-display);padding:14px 0}
ul.plain{list-style:none;margin:0;padding:0}
.fab{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--pine);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px))}
.fab-in{display:flex;align-items:center;gap:12px;max-width:600px;margin:0 auto}
.fab-in b{margin-left:auto;font-size:18px}
@media(max-width:960px){.fab.on{display:block}}

/* modal & toast */
.backdrop{position:fixed;inset:0;z-index:50;background:rgba(8,18,14,.6);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.modal{background:var(--surface);color:var(--ink);border-radius:16px;width:min(520px,100%);padding:22px;box-shadow:var(--shadow);animation:pop .16s ease-out}
.modal.sm{width:min(420px,100%)}
.modal.rc{width:min(440px,100%)}
.modal h2{margin-bottom:6px}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;margin-top:18px}
.modal-actions.start{justify-content:flex-start}
.placed{background:var(--ok-bg);color:var(--ok);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.placed b{font-size:17px}
.placed p{margin:2px 0 0;font-size:14px}
.preview{background:var(--paper);border-radius:10px;padding:10px 12px;font-weight:700;margin-bottom:14px}
.preview.bad{background:var(--bad-bg);color:var(--bad)}
.sumlist{background:var(--paper);border-radius:10px;padding:8px 12px;margin:4px 0 14px;font-size:14px}
.sumlist .row{padding:5px 0;border-color:var(--line)}
.radios{display:flex;gap:10px}
.radios label{flex:1;display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;font-weight:600;margin:0}
.radios input{width:auto;min-height:0}
@keyframes pop{from{transform:translateY(8px) scale(.98);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.modal{animation:none}html{scroll-behavior:auto}}
#toasts{position:fixed;left:0;right:0;bottom:0;z-index:80;padding:0 16px calc(84px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;box-shadow:var(--shadow);max-width:min(440px,100%)}
.toast.bad{background:var(--bad);color:var(--surface)}
.danger-zone{border-color:var(--bad)}

/* ===== Design system additions (v2) ===== */
.ic{width:18px;height:18px;flex:none;vertical-align:-3px}
.btn .ic{margin-right:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;transition:background .15s,border-color .15s,filter .15s,transform .05s}
.btn:active:not(:disabled){transform:translateY(1px)}
code{font-family:ui-monospace,'Courier New',monospace;font-size:.9em;background:var(--paper);padding:1px 6px;border-radius:6px}
.muted.sm,.sm{font-size:13px}
.tab{display:inline-flex;align-items:center;gap:6px}
.tab .ic{margin:0}
.who-name{max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .btn .ic{margin-right:6px}
.foot{text-align:center;color:var(--muted);font-size:13px;padding:18px 20px calc(24px + 8px)}
.banner .linkbtn{color:inherit}
.tile b small{font-family:var(--f-body);font-size:15px;font-weight:500;color:var(--muted)}
.tile{transition:box-shadow .15s}
.tile:hover{box-shadow:var(--shadow)}
.badge.info{background:var(--info-bg);color:var(--info)}
.pcard .desc{margin:0;color:var(--muted);font-size:14px}
.pcard{transition:box-shadow .15s,border-color .15s}
.pcard:hover{box-shadow:var(--shadow);border-color:var(--muted)}

/* toolbar: search + selects */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.toolbar select{width:auto;min-width:170px}
.search{position:relative;flex:1 1 260px;max-width:460px}
.search .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:38px}
.table-wrap.flat{border:0;border-radius:0}

/* notification bell */
.bellwrap{position:relative}
.icon-btn{position:relative;background:transparent;border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:10px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer}
.icon-btn:hover{background:rgba(255,255,255,.12)}
.icon-btn .ic{width:20px;height:20px;margin:0}
.count{position:absolute;top:-6px;right:-6px;min-width:20px;height:20px;padding:0 5px;border-radius:999px;background:var(--saffron);color:var(--on-saffron);font-size:12px;font-weight:800;display:grid;place-items:center;animation:pop .2s ease-out}
.bellpanel{position:absolute;right:0;top:calc(100% + 10px);width:min(380px,calc(100vw - 24px));max-height:70vh;overflow-y:auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px;z-index:40;animation:pop .16s ease-out}
.bp-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.bp-head h2{font-size:18px}
.notif{display:flex;gap:10px;width:100%;text-align:left;font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 4px;cursor:pointer;border-radius:8px}
.notif:hover{background:var(--paper)}
.notif .dot{flex:none;width:9px;height:9px;border-radius:50%;margin-top:7px;background:transparent}
.notif.unread .dot{background:var(--saffron)}
.notif .nb{display:flex;flex-direction:column;font-size:14px;gap:1px}
.notif .nb b{font-size:15px}
.notif time{color:var(--muted);font-size:13px;margin-top:3px}
.bellpanel li:last-child .notif{border-bottom:0}
@media(max-width:560px){.bellwrap{position:static}.bellpanel{left:12px;right:12px;width:auto;top:64px;position:fixed}}

/* order details + progress */
.od-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}
.steps{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 16px}
.step{flex:1;text-align:center;font-size:12px;font-weight:600;border-top:4px solid var(--line);padding-top:6px;color:var(--muted)}
.step.done{border-color:var(--ok);color:var(--ink)}
.kvl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kvl dt{color:var(--muted)}
.kvl dd{margin:0;text-align:right;overflow-wrap:anywhere}
.modal.od-modal{width:min(560px,100%)}

/* toasts slide in */
.toast{animation:slideup .2s ease-out}
@keyframes slideup{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.toast,.count,.bellpanel,.btn,.tile,.pcard{animation:none;transition:none}}

/* tables turn into cards on small screens */
@media(max-width:720px){
  .wrap{padding:16px 14px 32px}
  .top{padding:10px 14px}
  table.stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  table.stack,table.stack tbody,table.stack tr,table.stack td{display:block;width:100%}
  table.stack tr{padding:10px 2px;border-bottom:1px solid var(--line)}
  table.stack tr:last-child{border-bottom:0}
  table.stack td{display:flex;justify-content:space-between;align-items:center;gap:14px;border:0;padding:5px 14px;text-align:right}
  table.stack td::before{content:attr(data-label);font-weight:600;color:var(--muted);text-align:left;flex:none}
  table.stack td.full{display:block;text-align:left}
  table.stack td.full::before{display:none}
  table.stack td.full .acts{justify-content:flex-start}
  .who-name{display:none}
  .toolbar select{flex:1 1 150px}
  .page-head .acts{width:100%}
}

/* header: navigation drops to its own row on narrower laptops so no tab is clipped */
@media(min-width:900px) and (max-width:1399px){.top nav{order:3;width:100%;flex:none}}
/* KPI cards: two tidy rows of four on desktop */
@media(min-width:900px){.tiles{grid-template-columns:repeat(4,1fr)}}
.cv{display:block}.blk{display:block}
@media(max-width:720px){.cv{text-align:right}}

/* loading state shown for a moment while the app starts */
.boot{min-height:100dvh;display:grid;place-content:center;justify-items:center;gap:14px;color:var(--muted);font-weight:600}

@keyframes spin{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.boot i{animation-duration:2.4s}}

/* login: price board text size, and the form comes first on phones */
.pb li .price{font-family:var(--f-body);font-size:17px;font-weight:700}
@media(max-width:860px){.login .gate{order:-1;padding-top:28px}.board{gap:24px}.wordmark{font-size:clamp(44px,14vw,64px)}}

.callout .acts{display:flex;flex-wrap:wrap;gap:8px}

/* ===== Admin layout: sidebar + top bar ===== */
.admin-shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh}
.sidebar{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--pine);color:#fff;display:flex;flex-direction:column;padding:18px 14px;overflow-y:auto;z-index:60}
.sb-brand{display:flex;align-items:center;gap:12px;padding:4px 8px 18px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:14px}
.sb-name{display:flex;flex-direction:column;align-items:flex-start;gap:4px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.01em;line-height:1.1}
.sidebar nav{display:flex;flex-direction:column;gap:4px;flex:1;overflow:visible;order:0;width:auto}
.sidebar .tab{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 14px;border-radius:10px;font-size:15px;min-height:44px;color:#D5DED8}
.sidebar .tab .ic{width:20px;height:20px}
.sidebar .tab:hover{background:rgba(255,255,255,.08);color:#fff}
.sidebar .tab[aria-current="page"]{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--saffron)}
.sb-foot{border-top:1px solid rgba(255,255,255,.12);padding-top:14px;margin-top:14px;display:flex;flex-direction:column;gap:12px}
.sb-user{display:flex;align-items:center;gap:10px;min-width:0}
.avatar{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-weight:800}
.sb-uname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.sidebar .btn{background:transparent;color:#fff;border-color:rgba(255,255,255,.4);width:100%}
.sidebar .btn:hover{background:rgba(255,255,255,.1)}
.main-col{min-width:0;display:flex;flex-direction:column;min-height:100dvh}
.main-col .wrap{width:100%;max-width:1280px;margin:0 auto;flex:1}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 24px;min-height:62px}
.crumb{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:15px}
.crumb b{color:var(--ink)}
.topbar .who{margin-left:auto;display:flex;align-items:center;gap:12px}
.topbar .icon-btn{border-color:var(--line);color:var(--ink);background:var(--surface)}
.topbar .icon-btn:hover{background:var(--paper)}
.menu-btn{display:none;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:10px;width:42px;height:42px;place-items:center;cursor:pointer}
.menu-btn .ic{width:22px;height:22px;margin:0}
.sb-scrim{display:none}
.bp-acts{display:flex;gap:14px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media(max-width:980px){
  .admin-shell{grid-template-columns:minmax(0,1fr)}
  .sidebar{position:fixed;left:0;top:0;bottom:0;align-self:stretch;height:100dvh;width:min(290px,84vw);transform:translateX(-102%);transition:transform .22s ease;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
  .menu-open .sidebar{transform:none;box-shadow:var(--shadow)}
  .menu-open .sb-scrim{display:block;position:fixed;inset:0;background:rgba(8,18,14,.55);z-index:55}
  .menu-btn{display:grid}
  .topbar{padding:10px 14px}
}
@media(prefers-reduced-motion:reduce){.sidebar{transition:none}}

/* table action buttons stay on one line next to the sidebar */
.btn{white-space:nowrap}
@media(min-width:721px){
  .table-wrap td.full{white-space:nowrap;width:1%}
  .table-wrap td.full .acts{flex-wrap:nowrap;gap:6px}
  .table-wrap .btn.sm{padding:6px 10px}
}

.nw{white-space:nowrap}

@media print{
  :root{padding:0}
  body{background:#fff}
  #shell,#toasts,.fab,.no-print{display:none!important}
  .backdrop{position:static;background:none;padding:0;overflow:visible;display:block}
  .modal{box-shadow:none;border-radius:0;width:100%;padding:0;animation:none;background:#fff}
}

<script>
(function(){
'use strict';

/* =====================================================================
   MANUAL CONFIGURATION  (SAFE TO EDIT)
   ---------------------------------------------------------------------
   Everything in this block can be changed by hand. Save the file and
   reload the page. Settings that the admin changes inside the app
   (currency symbol, receipt address, phone, receipt message) are in
   Admin > Settings instead.
   ===================================================================== */
const APP_NAME='Sib\'s Trading';          // Business name shown on every screen, receipt and page title.
const APP_TAGLINE='Raw chicken and by-products, counted and ordered.';
const DEFAULT_CURRENCY='₱';               // First-run default only. Change later in Admin > Settings.
const ORDER_PREFIX='ORD';                 // Receipt numbers look like ORD-10001.
const ORDER_NUMBER_OFFSET=10000;          // The first new order is OFFSET + 1.
const LOW_STOCK_DEFAULT=5;                // Pre-filled "Low-stock alert" when adding a product.
const MAX_QTY_PER_ITEM=500;               // Largest quantity one customer can order of a single product.

const MAX_TRIES=3;                        // Wrong log in tries before log in is paused...
const LOCK_MS=60000;                      // ...and how long the pause lasts (60000 = 1 minute).

/* DATABASE (FIREBASE)  (SAFE TO EDIT)
   true  = use the shared Firebase Realtime Database + Firebase Authentication.
   false = browser-only "local mode" (data stays on this one device).
   If Firebase cannot be reached (for example the page is opened from a place that
   blocks it), the app automatically falls back to local mode and says so. */
const USE_FIREBASE=true;
const FIREBASE_SDK_VERSION='10.14.1';     // Version of the Firebase web SDK that is loaded.
const FIREBASE_CONNECT_TIMEOUT_MS=8000;   // How long to wait for Firebase before falling back to local mode.
// This is your web app's Firebase configuration. These values identify your project; they are not
// passwords. Your data is protected by Firebase Authentication and the database rules in
// database.rules.json (see FIREBASE_SETUP.md). Never leave the database in "test mode".
const FIREBASE_CONFIG={
  apiKey:'AIzaSyB1hz_7eGw-ux39UhWMoOSIkN3hm0-L1uQ',
  authDomain:'sib-s-trading.firebaseapp.com',
  databaseURL:'https://sib-s-trading-default-rtdb.asia-southeast1.firebasedatabase.app',
  projectId:'sib-s-trading',
  storageBucket:'sib-s-trading.firebasestorage.app',
  messagingSenderId:'902958827178',
  appId:'1:902958827178:web:8153e30915a822aee9b2d3',
  measurementId:'G-03EJ8X0NBF'
};

/* NOTIFICATION SETTINGS  (SAFE TO EDIT) */
const ENABLE_ADMIN_DASHBOARD_NOTIFICATIONS=true;  // Bell + list for new orders (admin).
const ENABLE_CUSTOMER_NOTIFICATIONS=true;         // Bell + list for order updates (customer).
const NOTIFY_CUSTOMER_ORDER_RECEIVED=true;        // Customer is told right away that their order was received.
// Customer is notified when the admin moves the order to one of these statuses.
// Choose from: 'confirmed', 'processing', 'ready', 'completed', 'cancelled'.
const NOTIFY_CUSTOMER_ON_STATUSES=['ready'];
const SHOW_NOTIFICATION_TOASTS=true;              // Pop-up message when a new notification arrives while the app is open.
const NOTIFICATION_SOUND=true;                    // Play a short chime when a notification arrives. Each person can also switch it off in the bell panel.
// Note: browsers only allow sound after the person has clicked or tapped the page at least once (for example the log in click).
const MAX_NOTIFICATIONS_KEPT=200;                 // Local mode only: older notifications are dropped after this many.
// Email, SMS and phone push notifications are NOT part of this file. They need a server.
// See SYSTEM_RECOMMENDATIONS.md.

/* DEFAULT ADMIN ACCOUNT  (local mode only, first run only)
   In cloud mode the admin account is created in the Firebase console (see FIREBASE_SETUP.md). */
const DEFAULT_ADMIN_USERNAME='admin';
const DEFAULT_ADMIN_PASSWORD='admin123';

/* IMPORTANT:
   Do not change the values below unless you understand the consequences.
   Changing a storage key makes local mode start with an empty database. */
const KEY='sibs-trading:v1', LOCK_KEY='sibs-trading:lock', SESSION_KEY='sibs-trading:session';
const PBKDF2_ITERATIONS=150000;
const MAX_STOCK_LOG=5000;
const MAX_ERROR_LOG=100;

const CAT={cuts:'Whole & cuts',by:'By-products'};
const STATUS={pending:'Pending',confirmed:'Confirmed',processing:'Processing',ready:'Ready',completed:'Completed',cancelled:'Cancelled'};
const STATUS_CLS={pending:'warn',confirmed:'info',processing:'info',ready:'ok',completed:'muted',cancelled:'bad'};
const STATUS_FLOW=['pending','confirmed','processing','ready','completed'];   // order progress shown to customers
const ORDER_FAIL="We couldn't complete your order right now. Please check the available quantity and try again.";

/* =====================================================================
   SMALL HELPERS
   ===================================================================== */
const mem={};   // in-memory fallback if the browser blocks storage
function rd(kind,k){try{return window[kind].getItem(k);}catch(e){return mem[kind+k]==null?null:mem[kind+k];}}
function wr(kind,k,v){try{window[kind].setItem(k,v);return true;}catch(e){mem[kind+k]=v;return false;}}
function rm(kind,k){try{window[kind].removeItem(k);}catch(e){delete mem[kind+k];}}
const $=(s,r=document)=>r.querySelector(s);
// Every piece of user-typed text must go through esc() before it is placed in HTML.
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const r2=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const money=(n,cur)=>(cur==null?db.settings.currency:cur)+r2(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const qf=n=>String(r2(n));
const sum=a=>a.reduce((x,y)=>x+y,0);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const fdate=iso=>new Date(iso).toLocaleString(undefined,{dateStyle:'medium',timeStyle:'short'});
const isToday=iso=>new Date(iso).toDateString()===new Date().toDateString();
const fmtLeft=ms=>{const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');};
function timeAgo(iso){
  const s=Math.max(0,Math.floor((Date.now()-new Date(iso).getTime())/1000));
  if(s<60)return 'Just now';
  const m=Math.floor(s/60);if(m<60)return m+' minute'+(m===1?'':'s')+' ago';
  const h=Math.floor(m/60);if(h<24)return h+' hour'+(h===1?'':'s')+' ago';
  const d=Math.floor(h/24);return d+' day'+(d===1?'':'s')+' ago';
}
// An error whose message is safe and helpful to show to the person using the app.
class UserError extends Error{}
const userErr=msg=>new UserError(msg);

/* Icons (inline SVG so nothing is downloaded). Always paired with a text label. */
const ICONS={
  home:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',
  clipboard:'<rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4h6v3H9z"/><path d="M9 12h6M9 16h4"/>',
  box:'<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.5 3-6 6.5-6s6.5 2.5 6.5 6"/><path d="M16 4.5a3.5 3.5 0 010 7M18 14c2 .6 3.5 2.5 3.5 6"/>',
  chart:'<path d="M4 20V4"/><path d="M4 20h16"/><path d="M8 16v-5M13 16V8M18 16v-3"/>',
  cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
  cart:'<circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.5 12h11L21 7H6"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.6-7 8-7s8 3 8 7"/>',
  bell:'<path d="M6 17V11a6 6 0 0112 0v6l2 2H4l2-2z"/><path d="M10 21a2 2 0 004 0"/>',
  logout:'<path d="M9 4H5v16h4"/><path d="M16 8l4 4-4 4M20 12H9"/>',
  search:'<circle cx="11" cy="11" r="6"/><path d="M20 20l-4.5-4.5"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  download:'<path d="M12 4v11M7 11l5 5 5-5"/><path d="M5 20h14"/>',
  menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',
  print:'<path d="M7 9V3h10v6"/><rect x="4" y="9" width="16" height="8" rx="2"/><path d="M7 14h10v7H7z"/>'
};
const icon=n=>`<svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">${ICONS[n]||''}</svg>`;

/* =====================================================================
   PASSWORDS  (LOCAL MODE ONLY, SECURITY-SENSITIVE)
   ---------------------------------------------------------------------
   In cloud mode Firebase Authentication stores and checks passwords; none
   of this code is used.
   In local mode, new passwords use PBKDF2-SHA256 with a random salt,
   stored as "pbkdf2$iterations$salt$hash". Hashes from the first version
   of this app (plain SHA-256) still work and are upgraded on next log in.
   ===================================================================== */
const toHex=buf=>Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');
const fromHex=h=>new Uint8Array((h.match(/../g)||[]).map(x=>parseInt(x,16)));
async function pbkdf2(pw,salt,iterations){
  const key=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']);
  return toHex(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt,iterations},key,256));
}
async function legacySha(s){try{return toHex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('sibs:'+s)));}catch(e){return 'plain:'+s;}}
async function hashPassword(pw){
  try{
    const salt=crypto.getRandomValues(new Uint8Array(16));
    return `pbkdf2$${PBKDF2_ITERATIONS}$${toHex(salt)}$${await pbkdf2(pw,salt,PBKDF2_ITERATIONS)}`;
  }catch(e){return 'plain:'+pw;}   // only if the browser has no crypto support (non-secure page)
}
async function verify(stored,pw){
  if(stored&&stored.indexOf('pbkdf2$')===0){
    try{const p=stored.split('$');return await pbkdf2(pw,fromHex(p[2]),parseInt(p[1],10))===p[3];}catch(e){return false;}
  }
  return stored===await legacySha(pw)||stored==='plain:'+pw;
}
const isLegacyHash=h=>!h||h.indexOf('pbkdf2$')!==0;

/* =====================================================================
   DATA
   ---------------------------------------------------------------------
   The app always works on an in-memory copy called `db`:
   { settings, admin, users[], products[], orders[], stockLog[],
     notifications[], errorLog[], counter }
   * Local mode: `db` is saved as one JSON object in the browser.
   * Cloud mode: `db` is a live mirror of the Firebase Realtime Database.
     Changes are written to Firebase and flow back into `db` automatically.
   ===================================================================== */
let db=null;
let MODE='local';   // 'local' or 'cloud'. Decided at start-up.
const cloud={m:null,auth:null,db:null,userSubs:[],pubSubs:[],warned:{},firstAuth:null};
const state={session:null,view:'',loginMode:'login',loginMsg:'',loginUser:'',shopQ:'',shopCat:'all',cart:{},
  invTab:'products',invQ:'',invSort:'name',invFilter:'all',histProduct:'all',orderFilter:'all',orderQ:'',
  reportRange:'7',bellOpen:false,noStorage:false,busy:false,ordering:false,registering:false,
  cloudFailed:false,announced:null,notifsLoaded:false,menuOpen:false};
let lockTimer=null,lastFocus=null,confirmCb=null,warnedSave=false;

const SAMPLE_PRODUCTS=[
  ['Whole chicken','cuts','kg',190,10,'Whole raw chicken, sold by weight.'],
  ['Chicken breast','cuts','kg',240,5,'Raw chicken breast.'],
  ['Chicken thigh','cuts','kg',210,5,'Raw chicken thigh.'],
  ['Chicken drumstick','cuts','kg',200,5,'Raw chicken drumsticks.'],
  ['Chicken wings','cuts','kg',220,5,'Raw chicken wings.'],
  ['Chicken feet','by','kg',90,3,'Raw chicken feet.'],
  ['Chicken liver','by','kg',80,3,'Raw chicken liver.'],
  ['Chicken gizzard','by','kg',100,3,'Raw chicken gizzard.'],
  ['Chicken heart','by','kg',120,3,'Raw chicken heart.'],
  ['Chicken neck','by','kg',70,3,'Raw chicken neck.'],
  ['Chicken skin','by','kg',60,3,'Raw chicken skin.']
];  // Sample products. The prices are placeholders: edit them in Admin > Inventory.
const defaultSettings=()=>({currency:DEFAULT_CURRENCY,address:'',phone:'',footer:'Thank you for your order!'});
const emptyDb=()=>({v:2,counter:0,settings:defaultSettings(),admin:null,users:[],products:[],orders:[],stockLog:[],notifications:[],errorLog:[]});

async function seed(){
  const d=emptyDb();
  d.admin={username:DEFAULT_ADMIN_USERNAME,hash:await hashPassword(DEFAULT_ADMIN_PASSWORD)};
  d.products=SAMPLE_PRODUCTS.map((s,i)=>({id:uid(),name:s[0],cat:s[1],unit:s[2],price:s[3],stock:0,low:s[4],desc:s[5],totalIn:0,totalOut:0,ord:i}));
  return d;
}
// Brings data saved by an older version up to date. Safe to run many times. (Local mode)
function migrate(d){
  d.users=d.users||[];d.orders=d.orders||[];d.stockLog=d.stockLog||[];d.errorLog=d.errorLog||[];
  d.notifications=d.notifications||[];
  if(Array.isArray(d.notifications))d.notifications.forEach(n=>{if(!n.audience)n.audience='admin';});   // notifications from older versions were all for the admin
  d.settings=Object.assign(defaultSettings(),d.settings||{});
  d.products.forEach(p=>{
    if(p.totalIn==null||p.totalOut==null){
      // Rebuild stock-in/out totals from the log, but only if the old log was never trimmed (it kept 1000 rows).
      if(d.stockLog.length>=1000){p.totalIn=null;p.totalOut=null;return;}
      p.totalIn=0;p.totalOut=0;
      d.stockLog.forEach(l=>{if(l.productId===p.id){if(l.change>0)p.totalIn=r2(p.totalIn+l.change);else p.totalOut=r2(p.totalOut-l.change);}});
    }
  });
  return d;
}
function save(){
  if(MODE!=='local')return;   // cloud mode saves each change straight to Firebase instead
  if(!wr('localStorage',KEY,JSON.stringify(db))&&!warnedSave){
    warnedSave=true;state.noStorage=true;
    toast('Could not save to this browser. Changes may be lost when you close the page.','bad');
  }
}
// Local mode: re-reads the database from storage so a second open tab can't leave us with stale numbers.
function syncFromStorage(){
  if(MODE!=='local')return false;
  const raw=rd('localStorage',KEY);if(!raw)return false;
  try{const fresh=JSON.parse(raw);if(fresh&&fresh.products){db=migrate(fresh);return true;}}catch(e){}
  return false;
}
// Records a problem for the admin to review in Settings. Never throws.
function logError(area,err,extra){
  try{
    console.error('['+area+']',err);if(!db)return;
    const rec={date:new Date().toISOString(),area,message:String((err&&err.message)||err).slice(0,300),extra:String(extra||'').slice(0,200)};
    if(MODE==='cloud'){
      if(cloud.m&&state.session)cloud.m.set(cloud.m.push(R('errorLog')),Object.assign(rec,{uid:state.session.uid})).catch(()=>{});
      return;
    }
    db.errorLog.unshift(Object.assign({id:uid()},rec));
    if(db.errorLog.length>MAX_ERROR_LOG)db.errorLog.length=MAX_ERROR_LOG;
    save();
  }catch(e){}
}

/* ---------- login lock (applies to every log in attempt) ---------- */
function getLock(){
  let l=null;try{l=JSON.parse(rd('localStorage',LOCK_KEY)||'null');}catch(e){}
  l=l||{fails:0,until:0};
  if(l.until&&l.until<=Date.now())l={fails:0,until:0};
  return l;
}
function setLock(l){wr('localStorage',LOCK_KEY,JSON.stringify(l));}
function startLockTimer(){
  const tick=()=>{
    const left=getLock().until-Date.now();
    if(left<=0){clearInterval(lockTimer);setLock({fails:0,until:0});state.loginMsg='';render();return;}
    const el=$('#lockTime');if(el)el.textContent=fmtLeft(left);
  };
  tick();lockTimer=setInterval(tick,250);
}

/* =====================================================================
   INVENTORY LOGIC  (IMPORTANT)
   ---------------------------------------------------------------------
   Do not change this unless you understand the stock flow:
   every change to a product's stock must also be written to the stock
   history, so the history and the stock-in / stock-out totals stay correct.
   ===================================================================== */
const ownerKey=u=>u?(u.id||u.username):'';
const currentUser=()=>{
  if(!state.session)return null;
  return MODE==='cloud'?db.users.find(u=>u.id===state.session.uid):db.users.find(u=>u.username===state.session.username);
};
const ownsOrder=o=>!!state.session&&(o.uid||o.username)===state.session.uid;
function stockStatus(p){
  if(p.stock<=0)return {key:'out',label:'Out of Stock',cls:'bad'};
  if(p.stock<=p.low)return {key:'low',label:'Low Stock',cls:'warn'};
  return {key:'in',label:'In Stock',cls:'ok'};
}
function stockLogRecord(p,change,after,note){
  return {date:new Date().toISOString(),productId:p.id,name:p.name,change:r2(change),after:r2(after),note:note||'',
    by:state.session?state.session.name:'system',uid:state.session?state.session.uid:''};
}
// Local mode: updates the stock-in/out totals and adds the history row.
function logStock(p,change,note){
  change=r2(change);
  if(p.totalIn!=null){if(change>0)p.totalIn=r2(p.totalIn+change);else p.totalOut=r2((p.totalOut||0)-change);}
  db.stockLog.unshift(Object.assign({id:uid()},stockLogRecord(p,change,p.stock,note)));
  if(db.stockLog.length>MAX_STOCK_LOG)db.stockLog.length=MAX_STOCK_LOG;
}
// A quantity is valid if it is above zero, within the order limit, and a whole number for items not sold by weight.
const qtyOk=(p,q)=>q>0&&q<=MAX_QTY_PER_ITEM&&(p.unit==='kg'||Number.isInteger(q));
const qtyHint=p=>p.unit==='kg'?'Enter a quantity above zero.':`Enter a whole number of ${p.unit}.`;

/* =====================================================================
   NOTIFICATIONS  (admin and customer)
   ---------------------------------------------------------------------
   A notification is a small record: { audience:'admin'|'user', to, type,
   title, message, orderId, no, date, read }.
   * Admin gets one when a customer places an order.
   * Customer gets "Order received" when they place an order, and another
     when the admin moves the order to a status listed in
     NOTIFY_CUSTOMER_ON_STATUSES (by default: Ready).
   A notification is created AFTER the order is saved and in its own error
   handler, so a notification problem can never cancel an order.
   Cloud mode: notifications arrive live from Firebase.
   Local mode: they arrive live between tabs of the same browser.
   ===================================================================== */
const bellEnabled=()=>!!state.session&&(state.session.role==='admin'?ENABLE_ADMIN_DASHBOARD_NOTIFICATIONS:ENABLE_CUSTOMER_NOTIFICATIONS);
function myNotifs(){
  if(!state.session||!Array.isArray(db.notifications))return [];
  const s=state.session;
  return db.notifications
    .filter(n=>s.role==='admin'?(n.audience||'admin')==='admin':(n.audience==='user'&&n.to===s.uid))
    .sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
const unreadCount=()=>bellEnabled()?myNotifs().filter(n=>!n.read).length:0;

// The wording a customer sees. Edit the text here if you want different messages.
function customerNotice(o,kind){
  const delivery=o.customer&&o.customer.type==='delivery';
  if(kind==='received')return {type:'order_received',title:'Order received',message:`We received your order ${o.no}. We will let you know when it is ready.`};
  const m={
    confirmed:['Order confirmed',`Your order ${o.no} has been confirmed.`],
    processing:['Order being prepared',`Your order ${o.no} is being prepared.`],
    ready:delivery?['Order ready for delivery',`Your order ${o.no} is ready for delivery.`]:['Order ready for pickup',`Your order ${o.no} is ready for pickup.`],
    completed:['Order completed',`Your order ${o.no} is completed. Thank you!`],
    cancelled:['Order cancelled',`Your order ${o.no} was cancelled.`]
  }[kind];
  return m?{type:'order_'+kind,title:m[0],message:m[1]}:null;
}
function customerNoticeRecord(o,kind){
  const n=customerNotice(o,kind);if(!n)return null;
  return {type:n.type,title:n.title,message:n.message,orderId:o.id,no:o.no,date:new Date().toISOString(),read:false};
}
const shouldNotifyStatus=s=>ENABLE_CUSTOMER_NOTIFICATIONS&&NOTIFY_CUSTOMER_ON_STATUSES.includes(s);
function adminNoticeRecord(o){
  return {type:'new_order',orderId:o.id,no:o.no,customer:o.customer.name,itemCount:o.items.length,total:o.total,currency:o.currency,date:o.date,read:false};
}
// Local mode only
function pushLocalNotice(audience,to,rec){
  db.notifications.unshift(Object.assign({id:uid(),audience,to},rec));
  if(db.notifications.length>MAX_NOTIFICATIONS_KEPT)db.notifications.length=MAX_NOTIFICATIONS_KEPT;
}

/* ---- Notification sound (generated in the browser, no sound file needed) ---- */
let audioCtx=null;
function unlockAudio(){
  try{
    if(!audioCtx){const AC=window.AudioContext||window.webkitAudioContext;if(AC)audioCtx=new AC();}
    if(audioCtx&&audioCtx.state==='suspended')audioCtx.resume();
  }catch(e){}
}
const soundOn=()=>NOTIFICATION_SOUND&&rd('localStorage','sibs-trading:sound')!=='0';
function playChime(force){
  if(!NOTIFICATION_SOUND||(!force&&!soundOn()))return;
  try{
    unlockAudio();if(!audioCtx)return;
    const t0=audioCtx.currentTime;
    [[880,0],[1318.5,0.16]].forEach(([freq,delay])=>{   // two quick notes: "ding-dong"
      const o=audioCtx.createOscillator(),g=audioCtx.createGain();
      o.type='sine';o.frequency.value=freq;o.connect(g);g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001,t0+delay);
      g.gain.exponentialRampToValueAtTime(0.22,t0+delay+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+delay+0.5);
      o.start(t0+delay);o.stop(t0+delay+0.55);
    });
  }catch(e){}
}
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,unlockAudio,{passive:true}));

function notifPanelHTML(){

    :`<b>${esc(n.title)}</b><span>${esc(n.message)}</span>`;
  return `<div class="bp-head"><h2>Notifications</h2><div class="bp-acts">${NOTIFICATION_SOUND?`<button type="button" class="linkbtn" data-act="toggleSound" aria-pressed="${soundOn()}">Sound: ${soundOn()?'on':'off'}</button>`:''}${unreadCount()?'<button type="button" class="linkbtn" data-act="readAll">Mark all as read</button>':''}</div></div>`+
  (list.length?`<ul class="plain">${list.map(n=>`<li><button type="button" class="notif ${n.read?'':'unread'}" data-act="openNotif" data-id="${esc(n.id)}">
    <span class="dot" aria-hidden="true"></span><span class="nb">${item(n)}<time datetime="${esc(n.date)}">${timeAgo(n.date)}</time></span></button></li>`).join('')}</ul>`

// Shows a pop-up for notifications that arrived since the last check.
function announceNew(){
  if(!state.session||(MODE==='cloud'&&!state.notifsLoaded))return;
  const mine=myNotifs();
  if(!state.announced){state.announced=new Set(mine.map(n=>n.id));return;}
  const fresh=mine.filter(n=>!n.read&&!state.announced.has(n.id));
  mine.forEach(n=>state.announced.add(n.id));
  if(fresh.length&&bellEnabled()){
    if(SHOW_NOTIFICATION_TOASTS)toast(state.session.role==='admin'?'New order received':`${fresh[0].title}: ${fresh[0].message}`);
    playChime();

}

/* =====================================================================
   CLOUD LAYER  (Firebase Authentication + Realtime Database)
   ---------------------------------------------------------------------
   Only used when USE_FIREBASE is true and Firebase can be reached.
   Database layout:
     /settings /products/{id} /orders/{id} /stockLog/{id} /counter
     /users/{uid} /admins/{uid}=true
     /adminNotifications/{id} /userNotifications/{uid}/{id} /errorLog/{id}
   IMPORTANT: who may read or write each path is decided by the rules in
   database.rules.json, not by this file. Keep them published.
   ===================================================================== */
const R=p=>p?cloud.m.ref(cloud.db,p):cloud.m.ref(cloud.db);
async function cloudInit(){
  // 'SIBS_FIREBASE_SDK_BASE' is a test hook that lets the SDK be loaded from another address. Leave it unset.
  const base=window.SIBS_FIREBASE_SDK_BASE||`https://www.gstatic.com/firebasejs/${FIREBASE_SDK_VERSION}/`;
  const mods=await Promise.all([import(base+'firebase-app.js'),import(base+'firebase-auth.js'),import(base+'firebase-database.js')]);
  const m=Object.assign({},mods[0],mods[1],mods[2]);
  const app=m.initializeApp(FIREBASE_CONFIG);
  const auth=m.getAuth(app);
  try{await m.setPersistence(auth,m.browserSessionPersistence);}catch(e){}   // closing the tab logs the person out
  cloud.m=m;cloud.auth=auth;cloud.db=m.getDatabase(app);
}
// Starts listening to a path. Returns a function that stops listening.
function listen(target,cb){
  const m=cloud.m,r=typeof target==='string'?R(target):target;
  return m.onValue(r,snap=>{if(MODE!=='cloud')return;try{cb(snap.val());}catch(e){logError('listener',e);}},err=>{
    const k=String(typeof target==='string'?target:'query');
    console.error('Firebase listener failed for',k,err);
    if(!cloud.warned[k]){cloud.warned[k]=1;toast('Could not read data from the database. Please check the database rules (see FIREBASE_SETUP.md).','bad');}
  });
}
const toList=obj=>Object.keys(obj||{}).map(id=>Object.assign({id},obj[id]));
function mirrorProducts(v){
  db.products=toList(v).map(p=>Object.assign(p,{stock:Number(p.stock)||0,low:Number(p.low)||0,price:Number(p.price)||0}))
    .sort((a,b)=>(a.ord||0)-(b.ord||0)||String(a.name).localeCompare(String(b.name)));
  recomputeTotals();
}
function mirrorOrders(v){
  db.orders=toList(v).map(o=>{
    o.items=Array.isArray(o.items)?o.items:Object.values(o.items||{});
    o.customer=o.customer||{};
    // The total is always recalculated from the items; a total saved by a customer's browser is never trusted.
    o.total=r2(sum(o.items.map(i=>r2(Number(i.price)*Number(i.qty)))));
    return o;
  }).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
}
function mirrorStockLog(v){
  db.stockLog=toList(v).sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  recomputeTotals();
}
// Cloud mode: stock-in / stock-out totals are worked out from the stock history (admin only has the history).
function recomputeTotals(){
  if(MODE!=='cloud')return;
  const haveLog=state.session&&state.session.role==='admin';
  db.products.forEach(p=>{
    if(!haveLog){p.totalIn=null;p.totalOut=null;return;}
    p.totalIn=0;p.totalOut=0;
    db.stockLog.forEach(l=>{if(l.productId===p.id){if(l.change>0)p.totalIn=r2(p.totalIn+l.change);else p.totalOut=r2(p.totalOut-l.change);}});
  });
}
function mirrorNotifs(v,audience,to){
  db.notifications=toList(v).map(n=>Object.assign(n,{audience,to}));
  if(!state.notifsLoaded){state.notifsLoaded=true;state.announced=new Set(myNotifs().map(n=>n.id));}   // existing notifications don't pop up on log in
}
function unsubscribeUserData(){
  cloud.userSubs.forEach(off=>{try{off();}catch(e){}});cloud.userSubs=[];
  db.orders=[];db.users=[];db.stockLog=[];db.notifications=[];db.errorLog=[];
  state.notifsLoaded=false;state.announced=null;
}
function subscribeUserData(role,uidv){
  const m=cloud.m,subs=cloud.userSubs;
  if(role==='admin'){
    subs.push(listen('orders',v=>{mirrorOrders(v);afterData();}));
    subs.push(listen('users',v=>{db.users=toList(v).sort((a,b)=>String(a.name).localeCompare(String(b.name)));afterData();}));
    subs.push(listen('stockLog',v=>{mirrorStockLog(v);afterData();}));
    subs.push(listen('adminNotifications',v=>{mirrorNotifs(v,'admin','admin');afterData();}));
    subs.push(listen('errorLog',v=>{db.errorLog=toList(v).sort((a,b)=>String(b.date).localeCompare(String(a.date)));afterData();}));
  }else{
    subs.push(listen(m.query(R('orders'),m.orderByChild('uid'),m.equalTo(uidv)),v=>{mirrorOrders(v);afterData();}));
    subs.push(listen('users/'+uidv,v=>{db.users=v?[Object.assign({id:uidv},v)]:[];afterData();}));
    subs.push(listen('userNotifications/'+uidv,v=>{mirrorNotifs(v,'user',uidv);afterData();}));
  }
}
// Called whenever live data changes: refresh what is on screen without disturbing someone who is typing.
function afterData(){
  if(!state.session){refreshBoard();return;}
  refreshBell();announceNew();
  const busy=document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(!$('#modal-root .backdrop')&&!busy)renderView();
}
async function cloudStart(){
  const m=cloud.m;db=emptyDb();
  const firstOf=path=>new Promise(res=>{let done=false;const once=()=>{if(!done){done=true;res();}};
    cloud.pubSubs.push(listen(path,v=>{
      if(path==='settings')db.settings=Object.assign(defaultSettings(),v||{});else mirrorProducts(v);
      once();afterData();}));});
  await Promise.race([Promise.all([firstOf('settings'),firstOf('products')]),sleep(FIREBASE_CONNECT_TIMEOUT_MS)]);
  const firstAuth=new Promise(res=>{cloud.firstAuth=res;});
  m.onAuthStateChanged(cloud.auth,u=>{safe(onAuthChange,u);});
  await Promise.race([firstAuth,sleep(FIREBASE_CONNECT_TIMEOUT_MS)]);
  if(!state.session)render();
}
async function onAuthChange(user){
  try{
    if(state.registering)return;
    if(!user){
      if(state.session){unsubscribeUserData();state.session=null;state.cart={};render();}
      return;
    }
    if(state.session&&state.session.uid===user.uid)return;
    await establishSession(user);
  }finally{if(cloud.firstAuth){cloud.firstAuth();cloud.firstAuth=null;}}
}
// After Firebase says who the person is, the DATABASE decides the role: only uids listed under /admins are admins.
async function establishSession(user){
  const m=cloud.m;
  const isAdm=(await m.get(R('admins/'+user.uid))).val()===true;
  let profile=null;
  if(!isAdm){
    profile=(await m.get(R('users/'+user.uid))).val();
    if(!profile||profile.disabled===true){
      await m.signOut(cloud.auth);
      state.loginMsg=`This account is not active. Please contact ${APP_NAME}.`;render();return;
    }
  }
  unsubscribeUserData();
  startSession(isAdm?'admin':'user',{uid:user.uid,username:user.email||'',name:isAdm?'Admin':profile.name});
  subscribeUserData(isAdm?'admin':'user',user.uid);   // start listening once the session exists
}
function refreshBoard(){const ul=$('.pb ul');if(ul)ul.innerHTML=boardHTML();}
async function cloudChangePassword(current,next){
  const m=cloud.m,user=cloud.auth.currentUser;
  try{
    await m.reauthenticateWithCredential(user,m.EmailAuthProvider.credential(user.email,current));
    await m.updatePassword(user,next);
  }catch(err){
    const c=(err&&err.code)||'';
    if(c==='auth/invalid-credential'||c==='auth/wrong-password')throw userErr('Current password is not correct');
    throw err;
  }
}
function authMessage(err){
  const c=(err&&err.code)||'';
  if(c==='auth/network-request-failed')return 'We could not reach the server. Check your internet connection and try again.';
  if(c==='auth/too-many-requests')return 'Too many attempts. Please wait a few minutes, or use Forgot password.';
  if(c==='auth/email-already-in-use')return 'That email is already registered. Try logging in instead.';
  if(c==='auth/invalid-email')return 'Enter a valid email address.';
  if(c==='auth/weak-password')return `Password needs at least ${MIN_PASSWORD_LENGTH} characters.`;
  return null;
}

/* =====================================================================
   STORES: every change to products, orders, stock and notifications
   goes through here. There is one store for each mode.
   ---------------------------------------------------------------------
   IMPORTANT: Do not change these unless you understand the order and
   inventory flow. Both stores follow the same rules:
     * Prices and totals come from the PRODUCT records, never from the
       basket or the form.
     * Stock is checked for every line; if anything is short, nothing is sold.
     * Stock can never go below zero.
     * A cancelled order puts its stock back exactly once.
     * Notifications are created after the order is saved, and a failure to
       create one never cancels the order.
   ===================================================================== */
let store=null;

/* ---------- LOCAL STORE (data kept in this browser) ---------- */
const localStore={
  async placeOrder(inp){
    syncFromStorage();
    const u=currentUser();
    if(!u)throw userErr('Your account could not be found. Please log in again.');
    const lines=cartLines();
    if(!lines.length)throw userErr('Your basket is empty.');
    for(const l of lines){
      if(!qtyOk(l.p,l.qty))throw userErr(`Please check the quantity of ${l.p.name}. ${qtyHint(l.p)}`);
      if(l.qty>l.p.stock+1e-9)throw userErr(`${l.p.name} only has ${qf(l.p.stock)} ${l.p.unit} left. Please update your basket.`);
    }
    const backup=JSON.stringify(db);   // used to undo everything if saving the order fails half-way
    let order;
    try{
      db.counter=(db.counter||0)+1;
      const no=ORDER_PREFIX+'-'+String(ORDER_NUMBER_OFFSET+db.counter).padStart(5,'0');
      order={id:uid(),no,date:new Date().toISOString(),uid:u.username,username:u.username,currency:db.settings.currency,
        customer:{name:inp.name,phone:inp.phone,type:inp.type,address:inp.address,note:inp.note},payment:inp.payment,
        items:lines.map(l=>({id:l.p.id,name:l.p.name,unit:l.p.unit,price:l.p.price,qty:l.qty})),
        total:r2(sum(lines.map(l=>r2(l.p.price*l.qty)))),status:'pending'};
      lines.forEach(l=>{l.p.stock=r2(l.p.stock-l.qty);logStock(l.p,-l.qty,'Order '+no);});
      db.orders.unshift(order);save();
    }catch(err){
      db=JSON.parse(backup);logError('order',err);throw userErr(ORDER_FAIL);
    }
    // Notifications: separate from the order on purpose.
    try{if(ENABLE_ADMIN_DASHBOARD_NOTIFICATIONS)pushLocalNotice('admin','admin',adminNoticeRecord(order));save();}catch(err){logError('notification',err,order.no);}
    try{if(ENABLE_CUSTOMER_NOTIFICATIONS&&NOTIFY_CUSTOMER_ORDER_RECEIVED){pushLocalNotice('user',order.uid,customerNoticeRecord(order,'received'));save();}}catch(err){logError('notification',err,order.no);}
    return order;
  },
  async setStatus(o,nv){
    syncFromStorage();
    const o2=db.orders.find(x=>x.id===o.id);if(!o2)throw userErr('That order could not be found.');
    o2.status=nv;save();
    try{if(shouldNotifyStatus(nv)){const rec=customerNoticeRecord(o2,nv);if(rec)pushLocalNotice('user',o2.uid||o2.username,rec);save();}}
    catch(err){logError('notification',err,o2.no);}
    return o2;
  },
  async cancelOrder(o){
    syncFromStorage();
    const o2=db.orders.find(x=>x.id===o.id);
    if(!o2||o2.status==='cancelled'||o2.status==='completed')throw userErr('This order can no longer be cancelled.');
    // IMPORTANT: stock is restored exactly once, because a cancelled order can never be changed again.
    o2.items.forEach(i=>{const p=db.products.find(x=>x.id===i.id);if(p){p.stock=r2(p.stock+i.qty);logStock(p,i.qty,'Cancelled '+o2.no);}});
    o2.status='cancelled';save();
    try{if(shouldNotifyStatus('cancelled')){const rec=customerNoticeRecord(o2,'cancelled');if(rec)pushLocalNotice('user',o2.uid||o2.username,rec);save();}}
    catch(err){logError('notification',err,o2.no);}
  },
  // mode: 'add' | 'remove' | 'set'. IMPORTANT: stock can never go below zero.
  async adjustStock(id,mode,q,note){
    syncFromStorage();
    const p=db.products.find(x=>x.id===id);if(!p)throw userErr('That product no longer exists.');
    let after;
    if(mode==='add')after=p.stock+q;
    else if(mode==='remove'){if(q>p.stock+1e-9)throw userErr(`You only have ${qf(p.stock)} ${p.unit} in stock`);after=p.stock-q;}
    else after=q;
    after=r2(after);const change=r2(after-p.stock);
    if(change===0)throw userErr('The count did not change');
    p.stock=after;logStock(p,change,note||{add:'Stock added',remove:'Stock removed',set:'Count corrected'}[mode]);
    save();return {after};
  },
  async saveProduct(d,id){
    syncFromStorage();
    if(id){
      const p=db.products.find(x=>x.id===id);if(!p)throw userErr('That product no longer exists.');
      Object.assign(p,{name:d.name,cat:d.cat,unit:d.unit,price:d.price,low:d.low,desc:d.desc});
    }else{
      const p={id:uid(),name:d.name,cat:d.cat,unit:d.unit,price:d.price,stock:d.open,low:d.low,desc:d.desc,totalIn:0,totalOut:0,ord:Date.now()};
      db.products.push(p);if(d.open>0)logStock(p,d.open,'Starting stock');
    }
    save();
  },
  async deleteProduct(id){db.products=db.products.filter(x=>x.id!==id);save();},
  async seedProducts(){
    SAMPLE_PRODUCTS.forEach((s,i)=>db.products.push({id:uid(),name:s[0],cat:s[1],unit:s[2],price:s[3],stock:0,low:s[4],desc:s[5],totalIn:0,totalOut:0,ord:Date.now()+i}));
    save();
  },
  async saveSettings(s){Object.assign(db.settings,s);save();},
  async saveProfile(d){const u=currentUser();if(!u)return;Object.assign(u,d);save();},
  // ids: array of notification ids, or null for "all of mine"
  async markNotifs(ids){
    myNotifs().forEach(n=>{if(!ids||ids.includes(n.id)){const raw=db.notifications.find(x=>x.id===n.id);if(raw)raw.read=true;}});
    save();
  },
  async removeUser(key){db.users=db.users.filter(x=>x.username!==key);save();},
  async setUserActive(){},
  async clearErrors(){db.errorLog=[];save();}
};

/* ---------- CLOUD STORE (shared Firebase Realtime Database) ---------- */
const cloudStore={
  async placeOrder(inp){
    const m=cloud.m,s=state.session;
    const lines=cartLines();
    if(!lines.length)throw userErr('Your basket is empty.');
    // 1. Read the latest product records straight from the database. Prices and names are taken from here.
    const fresh=(await m.get(R('products'))).val()||{};
    const items=[];
    for(const l of lines){
      const fp=fresh[l.p.id];
      if(!fp)throw userErr(`${l.p.name} is no longer available. Please update your basket.`);
      if(!qtyOk(fp,l.qty))throw userErr(`Please check the quantity of ${fp.name}. ${qtyHint(fp)}`);
      if(l.qty>Number(fp.stock)+1e-9)throw userErr(`${fp.name} only has ${qf(fp.stock)} ${fp.unit} left. Please update your basket.`);
      items.push({id:l.p.id,name:fp.name,unit:fp.unit,price:Number(fp.price),qty:l.qty});
    }
    // 2. Take the next order number (atomic, so two customers never get the same number).
    const c=await m.runTransaction(R('counter'),cur=>(Number(cur)||0)+1);
    if(!c.committed)throw userErr(ORDER_FAIL);
    const no=ORDER_PREFIX+'-'+String(ORDER_NUMBER_OFFSET+Number(c.snapshot.val())).padStart(5,'0');
    // 3. Take the stock, one product at a time, each as an atomic "subtract if enough is left".
    const taken=[];
    for(const it of items){
      const res=await m.runTransaction(R('products/'+it.id+'/stock'),cur=>{
        if(cur===null)return cur;                 // value not loaded yet: the database will re-run this with the real value
        if(cur<it.qty-1e-9)return;                // not enough left: cancel this step (returning nothing aborts)
        return r2(cur-it.qty);
      });
      if(!res.committed){
        // Someone else bought the last of this product a moment ago. Earlier products were already taken;
        // a customer's browser is not allowed to put stock back, so leave a clear note for the admin.
        const ups={};
        taken.forEach(t=>{ups['stockLog/'+m.push(R('stockLog')).key]=stockLogRecord({id:t.it.id,name:t.it.name},0,t.after,`Order ${no} not completed. Stock for this item needs checking.`);});
        if(taken.length){try{await m.update(R(''),ups);}catch(e){}logError('order',new Error('Order stopped part-way; stock needs checking'),no);}
        throw userErr(`${it.name} just sold out. Please update your basket and try again.`);
      }
      taken.push({it,after:Number(res.snapshot.val())});
    }
    // 4. Save the order and the stock history together (all-or-nothing).
    const id=m.push(R('orders')).key;
    const order={no,date:new Date().toISOString(),uid:s.uid,username:s.username,currency:db.settings.currency,
      customer:{name:inp.name,phone:inp.phone,type:inp.type,address:inp.address,note:inp.note},payment:inp.payment,
      items,total:r2(sum(items.map(i=>r2(i.price*i.qty)))),status:'pending'};
    const ups={['orders/'+id]:order};
    taken.forEach(t=>{ups['stockLog/'+m.push(R('stockLog')).key]=stockLogRecord({id:t.it.id,name:t.it.name},-t.it.qty,t.after,'Order '+no);});
    try{await m.update(R(''),ups);}
    catch(err){logError('order',err,no);throw userErr("We couldn't save your order after reserving stock. Please contact "+APP_NAME+" with your basket details.");}
    const saved=Object.assign({id},order);
    // 5. Notifications. Separate from the order on purpose: if one fails the order still stands.
    if(ENABLE_ADMIN_DASHBOARD_NOTIFICATIONS){
      try{await m.set(R('adminNotifications/'+m.push(R('adminNotifications')).key),Object.assign(adminNoticeRecord(saved),{uid:s.uid}));}
      catch(err){logError('notification',err,no);}
    }
    if(ENABLE_CUSTOMER_NOTIFICATIONS&&NOTIFY_CUSTOMER_ORDER_RECEIVED){
      try{
        const nid=m.push(R('userNotifications/'+s.uid)).key;
        if(state.announced)state.announced.add(nid);   // they just placed the order: no pop-up needed
        await m.set(R('userNotifications/'+s.uid+'/'+nid),customerNoticeRecord(saved,'received'));
      }catch(err){logError('notification',err,no);}
    }
    return saved;
  },
  async setStatus(o,nv){
    const m=cloud.m;
    await m.update(R('orders/'+o.id),{status:nv});
    try{
      if(shouldNotifyStatus(nv)){
        const rec=customerNoticeRecord(o,nv),to=o.uid;
        if(rec&&to)await m.set(R('userNotifications/'+to+'/'+m.push(R('userNotifications/'+to)).key),rec);
      }
    }catch(err){logError('notification',err,o.no);}
    return o;
  },
  async cancelOrder(o){
    const m=cloud.m;
    // Only the first successful change to "cancelled" restores stock, so it can never be restored twice.
    const res=await m.runTransaction(R('orders/'+o.id+'/status'),cur=>{
      if(cur===null)return cur;
      if(cur==='cancelled'||cur==='completed')return;
      return 'cancelled';
    });
    if(!res.committed)throw userErr('This order can no longer be cancelled.');
    const ups={};
    for(const i of o.items){
      if(!db.products.find(p=>p.id===i.id))continue;
      const r=await m.runTransaction(R('products/'+i.id+'/stock'),cur=>cur===null?cur:r2(Number(cur)+Number(i.qty)));
      if(r.committed)ups['stockLog/'+m.push(R('stockLog')).key]=stockLogRecord({id:i.id,name:i.name},i.qty,Number(r.snapshot.val()),'Cancelled '+o.no);
    }
    if(Object.keys(ups).length)await m.update(R(''),ups);
    try{
      if(shouldNotifyStatus('cancelled')){
        const rec=customerNoticeRecord(o,'cancelled');
        if(rec&&o.uid)await m.set(R('userNotifications/'+o.uid+'/'+m.push(R('userNotifications/'+o.uid)).key),rec);
      }
    }catch(err){logError('notification',err,o.no);}
  },
  async adjustStock(id,mode,q,note){
    const m=cloud.m,p=db.products.find(x=>x.id===id);
    if(!p)throw userErr('That product no longer exists.');
    let before=null,short=false;
    const res=await m.runTransaction(R('products/'+id+'/stock'),cur=>{
      if(cur===null)return cur;
      before=Number(cur);let after;
      if(mode==='add')after=before+q;
      else if(mode==='remove'){if(q>before+1e-9){short=true;return;}after=before-q;}   // never below zero
      else after=q;
      return r2(after);
    });
    if(!res.committed)throw userErr(short?`You only have ${qf(before)} ${p.unit} in stock`:'Could not update the stock. Please try again.');
    const after=Number(res.snapshot.val()),change=r2(after-before);
    if(change===0)throw userErr('The count did not change');
    await m.set(R('stockLog/'+m.push(R('stockLog')).key),stockLogRecord(p,change,after,note||{add:'Stock added',remove:'Stock removed',set:'Count corrected'}[mode]));
    return {after};
  },
  async saveProduct(d,id){
    const m=cloud.m;
    if(id){
      await m.update(R('products/'+id),{name:d.name,cat:d.cat,unit:d.unit,price:d.price,low:d.low,desc:d.desc});
    }else{
      const key=m.push(R('products')).key;
      await m.set(R('products/'+key),{name:d.name,cat:d.cat,unit:d.unit,price:d.price,stock:d.open,low:d.low,desc:d.desc,ord:Date.now()});
      if(d.open>0)await m.set(R('stockLog/'+m.push(R('stockLog')).key),stockLogRecord({id:key,name:d.name},d.open,d.open,'Starting stock'));
    }
  },
  async deleteProduct(id){await cloud.m.remove(R('products/'+id));},
  async seedProducts(){
    const m=cloud.m,ups={},base=Date.now();
    SAMPLE_PRODUCTS.forEach((s,i)=>{ups['products/'+m.push(R('products')).key]={name:s[0],cat:s[1],unit:s[2],price:s[3],stock:0,low:s[4],desc:s[5],ord:base+i};});
    await m.update(R(''),ups);
  },
  async saveSettings(s){await cloud.m.set(R('settings'),Object.assign({},db.settings,s));},
  async saveProfile(d){await cloud.m.update(R('users/'+state.session.uid),d);},
  async markNotifs(ids){
    const m=cloud.m,s=state.session,ups={};
    const base=s.role==='admin'?'adminNotifications/':'userNotifications/'+s.uid+'/';
    myNotifs().forEach(n=>{if(!n.read&&(!ids||ids.includes(n.id)))ups[base+n.id+'/read']=true;});
    if(Object.keys(ups).length)await m.update(R(''),ups);
  },
  // "Remove" deactivates the account: a browser cannot delete another person's sign-in account.
  async removeUser(key){await cloud.m.update(R('users/'+key),{disabled:true});},
  async setUserActive(key,active){await cloud.m.update(R('users/'+key),{disabled:active?null:true});},
  async clearErrors(){await cloud.m.remove(R('errorLog'));}
};

function startSession(role,acct,extra){
  state.session=Object.assign({role,uid:acct.uid||acct.username,username:acct.username||'',name:acct.name||'Admin'},extra||{});
  if(MODE==='local')wr('sessionStorage',SESSION_KEY,JSON.stringify(state.session));

}
async function logout(){
  state.cart={};state.loginMsg='';state.bellOpen=false;state.menuOpen=false;closeModal();
  if(MODE==='cloud'){
    unsubscribeUserData();state.session=null;render();
    try{await cloud.m.signOut(cloud.auth);}catch(e){}
    return;
  }
  state.session=null;rm('sessionStorage',SESSION_KEY);render();
}

function inventoryList(){
  const q=state.invQ.trim().toLowerCase();
  const list=db.products.filter(p=>p.name.toLowerCase().includes(q)&&(state.invFilter==='all'||stockStatus(p).key===state.invFilter));
  const sorters={name:(a,b)=>a.name.localeCompare(b.name),low:(a,b)=>a.stock-b.stock,high:(a,b)=>b.stock-a.stock,cat:(a,b)=>a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name)};
  return list.sort(sorters[state.invSort]||sorters.name);
}

function updateStockPreview(){
  const f=$('form[data-form=stock]');if(!f)return;
  const p=db.products.find(x=>x.id===f.dataset.id);if(!p)return;
  const mode=f.elements.mode.value,q=parseFloat(f.elements.qty.value);
  $('#stockLabel').textContent={add:`Quantity to add (${p.unit})`,remove:`Quantity to remove (${p.unit})`,set:`Counted stock (${p.unit})`}[mode];
  const el=$('#stockPreview');
  if(isNaN(q)){el.textContent=`Current count: ${qf(p.stock)} ${p.unit}`;el.className='preview';return;}
  const after=mode==='add'?p.stock+q:mode==='remove'?p.stock-q:q;
  el.textContent=`New count: ${qf(after)} ${p.unit}`;el.className='preview'+(after<0?' bad':'');
}

const csvCell=v=>{let s=String(v==null?'':v);if(typeof v!=='number'&&/^[=+\-@]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"';};   // the leading quote stops spreadsheet formula injection
function ordersCsv(list){

// Turns the basket into validated lines. Prices and stock always come from the product records, never from the basket.
function cartLines(){
  const out=[];
  Object.keys(state.cart).forEach(id=>{
    const p=db.products.find(x=>x.id===id),q=state.cart[id];
    if(!p||!(q>0)||p.stock<=0)return;
    const qty=r2(Math.min(q,p.stock,MAX_QTY_PER_ITEM));
    out.push({p,qty,amt:r2(p.price*qty)});
  });
  return out;
}
function gridHTML(){
  const q=state.shopQ.trim().toLowerCase();
  const list=db.products.filter(p=>(state.shopCat==='all'||p.cat===state.shopCat)&&(p.name.toLowerCase().includes(q)||(p.desc||'').toLowerCase().includes(q)));
  const none=db.products.length>0&&db.products.every(p=>p.stock<=0);
  const note=none?'<div class="card notice empty">Nothing is in stock right now. Please check back soon.</div>':'';
  if(!db.products.length)return '<div class="card notice empty">No products are listed yet. Please check back soon.</div>';
  if(!list.length)return note+'<div class="card notice empty">No products match your search. Try another name or category.</div>';
  return note+list.map(p=>{
    const inCart=state.cart[p.id]||0,avail=r2(Math.max(0,p.stock-inCart));
    const step=p.unit==='kg'?'0.1':'1',dis=avail<=0?'disabled':'';
    let cls='ok',txt=`${qf(avail)} ${p.unit} available`;
    if(p.stock<=0){cls='bad';txt='Sold out';}
    else if(avail<=0){cls='warn';txt='All available stock is in your basket';}
    else if(p.stock<=p.low){cls='warn';txt=`Only ${qf(avail)} ${p.unit} left`;}
    return `<article class="pcard ${p.stock<=0?'out':''}">
      <div class="pc-top"><h3>${esc(p.name)}</h3><span class="tag">${CAT[p.cat]||''}</span></div>
      ${p.desc?`<p class="desc">${esc(p.desc)}</p>`:''}
      <div class="price">${money(p.price)}<small>/${esc(p.unit)}</small></div>
      <div class="avail ${cls}">${txt}</div>
      ${p.stock<=0?'':`<div class="buy"><label class="sr" for="qty-${esc(p.id)}">Quantity in ${esc(p.unit)}</label>
      <input id="qty-${esc(p.id)}" type="number" min="${step}" step="${step}" inputmode="decimal" value="1" ${dis}><span class="unit">${esc(p.unit)}</span>
      <button type="button" class="btn primary sm" data-act="addCart" data-id="${esc(p.id)}" ${dis}>Add</button></div>`}</article>`;
  }).join('');
}
function cartHTML(){
  const lines=cartLines();
  if(!lines.length)return `<h2>Your basket</h2><div class="empty sm">Your basket is empty. Add products from the list.</div>`;
  const total=sum(lines.map(l=>l.amt));
  return `<h2>Your basket</h2><ul class="plain">${lines.map(l=>`<li class="cline">
    <div><div class="nm">${esc(l.p.name)}</div><div class="sub">${money(l.p.price)}/${esc(l.p.unit)}</div></div>
    <button type="button" class="icon" data-act="removeCart" data-id="${esc(l.p.id)}" aria-label="Remove ${esc(l.p.name)}">✕</button>
    <div class="qty"><label class="sr" for="cq-${esc(l.p.id)}">Quantity of ${esc(l.p.name)}</label><input id="cq-${esc(l.p.id)}" type="number" min="0" step="${l.p.unit==='kg'?'0.1':'1'}" inputmode="decimal" value="${l.qty}" data-change="cartQty" data-id="${esc(l.p.id)}"><span class="sub">${esc(l.p.unit)}</span></div>
    <div class="amt">${money(l.amt)}</div></li>`).join('')}</ul>
    <div class="totalrow"><span>Total</span><span>${money(total)}</span></div>
    <button type="button" class="btn primary block" data-act="checkout">Place order</button>
    <p class="switch" style="margin:10px 0 0"><button type="button" class="linkbtn" data-act="clearCart">Empty basket</button></p>`;
}
function fabHTML(){
  const lines=cartLines();if(!lines.length)return '';
  return `<div class="fab-in"><span>Basket: ${lines.length} item${lines.length===1?'':'s'}</span><b>${money(sum(lines.map(l=>l.amt)))}</b><button type="button" class="btn primary sm" data-act="gotoCart">View basket</button></div>`;
}
