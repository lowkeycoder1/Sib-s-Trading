const fd=f=>Object.fromEntries(new FormData(f));
function loginErr(msg){state.loginMsg=msg;render();}
const EMAIL_RE=/^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const forms={
  /* ---- Unified login: customers and admin use this same form ---- */
  async login(f){
    if(state.busy)return;
    const lock=getLock();if(lock.until>Date.now()){render();return;}
    const d=fd(f),cl=MODE==='cloud',typed=(d.username||'').trim(),u=cl?typed:typed.toLowerCase();state.loginUser=u;
    if(!u||!d.password){loginErr(cl?'Enter your email and password.':'Enter your username and password.');return;}
    if(cl&&!EMAIL_RE.test(u)){loginErr('Enter the email address you registered with.');return;}
    state.busy=true;
    const btn=$('#loginBtn');if(btn){btn.disabled=true;btn.textContent='Checking…';}
    let ok=false,count=true,msg='';
    try{
      if(cl){
        // Firebase checks the password. The role is decided afterwards from the database (see establishSession).
        try{await cloud.m.signInWithEmailAndPassword(cloud.auth,u,d.password);ok=true;}
        catch(err){const c=(err&&err.code)||'';
          if(c==='auth/network-request-failed'||c==='auth/too-many-requests'){count=false;msg=authMessage(err);}}
        if(ok){setLock({fails:0,until:0});state.busy=false;return;}   // the auth listener starts the session
      }else{
        let role=null,acct=null;
        if(u===db.admin.username.toLowerCase()){
          if(await verify(db.admin.hash,d.password)){
            role='admin';acct={username:db.admin.username,name:'Admin'};
            if(isLegacyHash(db.admin.hash)){db.admin.hash=await hashPassword(d.password);save();}
          }
        }else{
          const a=db.users.find(x=>x.username===u);
          if(a&&await verify(a.hash,d.password)){
            role='user';acct=a;
            if(isLegacyHash(a.hash)){a.hash=await hashPassword(d.password);save();}
          }else if(!a){await hashPassword(d.password);}   // spend the same time, so response speed does not reveal which usernames exist
        }
        if(role){state.busy=false;setLock({fails:0,until:0});startSession(role,acct,{defaultPw:role==='admin'&&d.password===DEFAULT_ADMIN_PASSWORD});return;}
      }
    }finally{state.busy=false;}
    if(!count){loginErr(msg);return;}
    const l=getLock();l.fails=(l.fails||0)+1;
    if(l.fails>=MAX_TRIES){l.until=Date.now()+LOCK_MS;state.loginMsg='';}
    else{const left=MAX_TRIES-l.fails;state.loginMsg=`Wrong ${cl?'email':'username'} or password. ${left} ${left===1?'try':'tries'} left.`;}
    setLock(l);render();
  },
  async userRegister(f){
    const d=fd(f),cl=MODE==='cloud',name=(d.name||'').trim(),u=(d.username||'').trim(),pw=d.password||'';
    if(!name||!u||!pw){loginErr(cl?'Fill in your name, email and a password.':'Fill in your name, a username and a password.');return;}
    if(pw.length<MIN_PASSWORD_LENGTH){loginErr(`Password needs at least ${MIN_PASSWORD_LENGTH} characters.`);return;}
    if(cl){
      if(!EMAIL_RE.test(u)){loginErr('Enter a valid email address.');return;}
      // Customers are only ever created with the customer role: a profile under /users and nothing under /admins.
      const m=cloud.m;state.registering=true;let cred=null;
      try{
        cred=await m.createUserWithEmailAndPassword(cloud.auth,u,pw);
        await m.set(R('users/'+cred.user.uid),{name,email:u,phone:'',address:'',created:new Date().toISOString()});
        state.registering=false;
        await establishSession(cred.user);
      }catch(err){
        state.registering=false;
        if(cred){try{await m.deleteUser(cred.user);}catch(e){}}   // don't leave an account without a profile
        logError('register',err);loginErr(authMessage(err)||'We could not create your account right now. Please try again.');
      }
      return;
    }
    const lu=u.toLowerCase();
    if(!/^[a-z0-9._-]{3,20}$/.test(lu)){loginErr('Username needs 3 to 20 letters, numbers, dots, dashes or underscores.');return;}
    syncFromStorage();
    if(lu===db.admin.username.toLowerCase()||db.users.some(x=>x.username===lu)){loginErr('That username is taken. Try another one.');return;}
    // Customers can only ever be created with the customer role. There is no role field to tamper with in this form.
    const acct={username:lu,name,phone:'',address:'',hash:await hashPassword(pw),created:new Date().toISOString()};
    db.users.push(acct);save();startSession('user',acct);
  },
  async forgot(f){
    const email=(fd(f).email||'').trim();
    if(!EMAIL_RE.test(email)){toast('Enter a valid email address','bad');return;}
    try{await cloud.m.sendPasswordResetEmail(cloud.auth,email);}
    catch(err){const c=(err&&err.code)||'';if(c!=='auth/user-not-found'){const msg=authMessage(err);if(msg){toast(msg,'bad');return;}}}
    closeModal();toast('If an account exists for that email, a reset link is on its way.');
  },
  async product(f){
    if(!isAdmin())return;
    const d=fd(f),id=f.dataset.id,name=(d.name||'').trim(),price=parseFloat(d.price),low=parseFloat(d.low);
    if(!name){toast('Enter a product name','bad');return;}
    if(!(price>=0)){toast('Enter a price (0 or more)','bad');return;}
    if(!(low>=0)){toast('Enter a low-stock level (0 or more)','bad');return;}
    const open=id?0:(parseFloat(d.open||'0')||0);
    if(open<0){toast('Starting stock cannot be negative','bad');return;}
    if(!id&&d.unit!=='kg'&&!Number.isInteger(open)){toast('Use a whole number for items sold per '+d.unit,'bad');return;}
    await store.saveProduct({name,cat:d.cat,unit:d.unit,price:r2(price),low:r2(low),desc:(d.desc||'').trim(),open:r2(open)},id);
    closeModal();renderView();toast(id?'Product updated':'Product added');
  },
  /* ---- Manual stock changes. IMPORTANT: stock can never go below zero. ---- */
  async stock(f){
    if(!isAdmin())return;
    const d=fd(f),p=db.products.find(x=>x.id===f.dataset.id);if(!p)return;
    const q=r2(parseFloat(d.qty));
    if(isNaN(q)||q<0){toast('Enter a quantity (0 or more)','bad');return;}
    if(p.unit!=='kg'&&!Number.isInteger(q)){toast(qtyHint(p),'bad');return;}
    if((d.mode==='add'||d.mode==='remove')&&!(q>0)){toast('Enter a quantity above zero','bad');return;}
    const res=await store.adjustStock(p.id,d.mode,q,(d.note||'').trim());
    closeModal();renderView();toast(`${p.name}: now ${qf(res.after)} ${p.unit}`);
  },
  async settings(f){
    if(!isAdmin())return;
    const d=fd(f);
    await store.saveSettings({address:(d.address||'').trim(),phone:(d.phone||'').trim(),currency:(d.currency||'').trim()||DEFAULT_CURRENCY,footer:(d.footer||'').trim()});
    renderView();toast('Business details saved');
  },
  async adminPass(f){
    if(!isAdmin())return;
    const d=fd(f);
    if((d.next||'').length<MIN_PASSWORD_LENGTH){toast(`New password needs at least ${MIN_PASSWORD_LENGTH} characters`,'bad');return;}
    if(d.next!==d.again){toast('The two new passwords do not match','bad');return;}
    if(MODE==='cloud')await cloudChangePassword(d.current||'',d.next);
    else{
      if(!(await verify(db.admin.hash,d.current||''))){toast('Current password is not correct','bad');return;}
      db.admin.hash=await hashPassword(d.next);save();
    }
    state.session.defaultPw=false;saveSession();renderShell();toast('Admin password changed');
  },
  async resetPw(f){   // local mode only
    if(!isAdmin())return;
    const d=fd(f),u=db.users.find(x=>x.username===f.dataset.key);if(!u)return;
    if((d.password||'').length<MIN_PASSWORD_LENGTH){toast(`Password needs at least ${MIN_PASSWORD_LENGTH} characters`,'bad');return;}
    u.hash=await hashPassword(d.password);save();closeModal();toast(`Password updated for ${u.name}`);
  },
  async profile(f){
    const d=fd(f),name=(d.name||'').trim();
    if(!name){toast('Enter your name','bad');return;}
    await store.saveProfile({name,phone:(d.phone||'').trim(),address:(d.address||'').trim()});
    state.session.name=name;saveSession();renderShell();toast('Your details were saved');
  },
  async userPass(f){
    const d=fd(f);
    if((d.next||'').length<MIN_PASSWORD_LENGTH){toast(`New password needs at least ${MIN_PASSWORD_LENGTH} characters`,'bad');return;}
    if(d.next!==d.again){toast('The two new passwords do not match','bad');return;}
    if(MODE==='cloud')await cloudChangePassword(d.current||'',d.next);
    else{
      const u=currentUser();if(!u)return;
      if(!(await verify(u.hash,d.current||''))){toast('Current password is not correct','bad');return;}
      u.hash=await hashPassword(d.next);save();
    }
    f.reset();toast('Password changed');
  },
  /* ---- PLACING AN ORDER: validation here, the rest in the store (see "STORES" above) ---- */
  async checkout(f){
    if(state.ordering)return;
    const d=fd(f);
    const name=(d.name||'').trim(),phone=(d.phone||'').trim(),type=d.type==='delivery'?'delivery':'pickup',address=(d.address||'').trim();
    if(!name){toast('Enter your name','bad');return;}
    if(!phone){toast('Enter a phone number we can reach you on','bad');return;}
    if(type==='delivery'&&!address){toast('Enter the delivery address','bad');return;}
    state.ordering=true;
    const btn=$('#placeBtn');if(btn){btn.disabled=true;btn.textContent='Placing order…';}
    let order;
    try{
      order=await store.placeOrder({name,phone,type,address,note:(d.note||'').trim(),
        payment:['Cash on pickup or delivery','Bank transfer','E-wallet'].includes(d.payment)?d.payment:'Cash on pickup or delivery'});
    }catch(err){
      state.ordering=false;
      if(btn){btn.disabled=false;btn.textContent='Place order';}
      if(!(err instanceof UserError))logError('order',err);
      toast(err instanceof UserError?err.message:ORDER_FAIL,'bad');
      refreshShop();return;
    }
    state.ordering=false;
    state.cart={};closeModal();renderView();
    if(state.announced)myNotifs().forEach(n=>state.announced.add(n.id));   // their own "Order received" needs no pop-up
    refreshBell();openReceipt(order,true);
  }
};

/* =====================================================================
   EVENT WIRING
   ===================================================================== */
// Every handler runs inside safe(), so one unexpected error shows a friendly message instead of breaking the page.
function handleFail(e){
  if(e instanceof UserError){toast(e.message,'bad');return;}
  logError('ui',e);toast('Something went wrong. Please try again.','bad');
}
function safe(fn,...args){
  try{const r=fn(...args);if(r&&typeof r.catch==='function')r.catch(handleFail);}catch(e){handleFail(e);}
}
document.addEventListener('click',e=>{
  if(state.bellOpen&&!e.target.closest('.bellwrap')){state.bellOpen=false;refreshBell();}
  if(e.target.classList&&e.target.classList.contains('backdrop')){closeModal();return;}
  const el=e.target.closest('[data-act]');
  if(el&&actions[el.dataset.act])safe(actions[el.dataset.act],el,e);
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;
  e.preventDefault();
  const fn=forms[f.dataset.form];if(fn)safe(fn,f);
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-change]');if(el&&changes[el.dataset.change])safe(changes[el.dataset.change],el,e);});
document.addEventListener('input',e=>{const el=e.target.closest('[data-input]');if(el&&inputs[el.dataset.input])safe(inputs[el.dataset.input],el,e);});
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape')return;
  if($('#modal-root .backdrop'))closeModal();
  else if(state.bellOpen){state.bellOpen=false;refreshBell();}
  else if(state.menuOpen)actions.closeMenu();
});
window.addEventListener('unhandledrejection',e=>{handleFail(e.reason);e.preventDefault();});

// Local mode: another tab in this browser changed the data (for example a customer placed an order, or the
// admin marked it ready). Update what is on screen.
function onExternalChange(){
  if(!syncFromStorage()||!state.session)return;
  refreshBell();announceNew();
  const busy=document.activeElement&&/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName);
  if(!$('#modal-root .backdrop')&&!busy&&views[state.view])renderView();
}
window.addEventListener('storage',e=>{if(MODE==='local'&&e.key===KEY)safe(onExternalChange);});

/* =====================================================================
   START
   ===================================================================== */
async function initLocal(){
  try{window.localStorage.setItem('sibs-trading:t','1');window.localStorage.removeItem('sibs-trading:t');}catch(e){state.noStorage=true;}
  const raw=rd('localStorage',KEY);
  try{db=raw?JSON.parse(raw):null;}catch(e){db=null;}
  if(!db||!db.products){db=await seed();}
  migrate(db);save();
  // Restore the session only if the account it names still exists, and take the ROLE from the database, never from the saved session.
  try{
    const s=JSON.parse(rd('sessionStorage',SESSION_KEY)||'null');
    if(s&&s.username){
      if(s.username===db.admin.username&&s.role==='admin'){state.session={role:'admin',uid:db.admin.username,username:db.admin.username,name:'Admin',defaultPw:!!s.defaultPw};state.view='dashboard';}
      else if(s.role==='user'){const a=db.users.find(u=>u.username===s.username);if(a){state.session={role:'user',uid:a.username,username:a.username,name:a.name};state.view='shop';}}
    }
  }catch(e){}
  store=localStore;MODE='local';
  announceNew();
  render();
}
async function init(){
  if(USE_FIREBASE){
    try{
      await Promise.race([cloudInit(),sleep(FIREBASE_CONNECT_TIMEOUT_MS).then(()=>{throw new Error('Firebase connection timed out');})]);
      MODE='cloud';store=cloudStore;
      await cloudStart();
      return;
    }catch(err){
      console.warn('Cloud database unavailable. Using local mode.',err);
      MODE='local';state.cloudFailed=true;
    }
  }
  await initLocal();
}
init();
})();
